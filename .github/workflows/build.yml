name: Build and Release (Rockchip ARMv8)

on:
  # schedule:
  #   - cron: '0 18 * * 4'
  workflow_dispatch:
    inputs:
      log_switch:
        description: "开启详细编译日志 (V=s)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
  # repository_dispatch:
  #   types: [build-trigger]
  # push:
  #   branches:
  #     - main
  #   tags:
  #     - '*'

# 全局环境变量统一管理，修改配置只需改此处
env:
  TZ: Asia/Shanghai
  REPO_DIR: lede
  TARGET_ARCH: rockchip/armv8
  CONFIG_FILE: xgp.config
  FEEDS_CONF: lede/feeds.conf.default

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check build space
        run: |
          df -h
          lsblk
          free -h

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 1024
          remove-dotnet: 'false'

      - name: Check build space after maximize
        run: |
          df -h
          lsblk
          free -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo ./install-env.sh

      - name: Prepare source code
        run: |
          ./prepare.sh

      # 缓存工具链+源码包，增加降级匹配提升缓存命中率
      - name: Cache dl & toolchain
        uses: actions/cache@v3
        id: toolchain-cache
        if: always()
        with:
          path: |
            lede/dl
            lede/staging_dir
          key: ${{ runner.os }}-openwrt-${{ hashFiles('lede/feeds.conf.default', 'xgp.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-

      # 缓存命中时刷新时间戳，避免工具链重复编译
      - name: Refresh stamp files (cache hit only)
        if: steps.toolchain-cache.outputs.cache-hit == 'true'
        run: |
          find lede/staging_dir -type f -name ".stamp_*" -exec touch {} +
          echo "缓存命中，已刷新编译时间戳"

      # 单独执行源码下载，下载失败直接终止，不浪费编译时间
      - name: Download source packages
        run: |
          cd lede
          make download -j$(nproc)

      - name: Build firmware
        run: |
          if [[ "${{ inputs.log_switch }}" == "true" ]]; then
            ./build.sh V=s
          else
            ./build.sh
          fi

      # 编译产物校验，没生成固件直接报错终止
      - name: Verify firmware output
        run: |
          OUTPUT_DIR="lede/bin/targets/rockchip/armv8"
          if [ ! -d "${OUTPUT_DIR}" ]; then
            echo "ERROR: 固件输出目录不存在，编译失败！"
            exit 1
          fi
          IMG_COUNT=$(ls ${OUTPUT_DIR}/*.img.gz 2>/dev/null | wc -l)
          echo "找到 ${IMG_COUNT} 个 img.gz 固件文件"
          if [ "${IMG_COUNT}" -eq 0 ]; then
            echo "ERROR: 未生成任何固件镜像！"
            exit 1
          fi

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          OUTPUT_DIR="lede/bin/targets/rockchip/armv8"
          cp ${OUTPUT_DIR}/*.img.gz release_assets/ || true
          cp ${OUTPUT_DIR}/openwrt-rockchip-armv8-nlnet_xiguapi-v3.manifest release_assets/ || true
          cp ${OUTPUT_DIR}/config.buildinfo release_assets/ || true
          cp ${OUTPUT_DIR}/feeds.buildinfo release_assets/ || true
          cp ${OUTPUT_DIR}/profiles.json release_assets/ || true
          cp ${OUTPUT_DIR}/version.buildinfo release_assets/ || true
          cp ${OUTPUT_DIR}/sha256sums release_assets/ || true
          bash -c "cd lede && git log -n 30" > release_assets/recent_git.log

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: release_assets/

      - name: Calculate disk usage
        if: always()
        run: |
          df -h
          lsblk
          du -h --max-depth=2

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: release_assets/

      - name: List release files
        run: |
          ls -lah
          ls -lah release_assets

      - name: Prepare release info
        id: release-prepare
        run: |
          current_date=$(date +'%y%m%d')
          current_time=$(date +'%H%M%S')
          new_tag=v0.${current_date}.${current_time}
          echo "current_date=${current_date}" >> $GITHUB_OUTPUT
          echo "current_time=${current_time}" >> $GITHUB_OUTPUT
          echo "new_tag=${new_tag}" >> $GITHUB_OUTPUT

          RELEASE_DATE=$(date '+%Y-%m-%d %H:%M:%S')
          VERSION="unknown"
          if [ -f release_assets/version.buildinfo ]; then
            VERSION=$(cat release_assets/version.buildinfo | grep '^r' | head -n 1 || echo "unknown")
          fi
          echo "RELEASE_TITLE=${RELEASE_DATE} - ${VERSION}" >> $GITHUB_OUTPUT

          image_prefix=LEDE-zzXGPv3-${current_date}${current_time}-
          echo "IMAGE_PREFIX=${image_prefix}" >> $GITHUB_OUTPUT

          # Release 头部兜底，文件缺失不崩溃
          if [ -f release_header.md ]; then
            cat release_header.md > release_info.md
          else
            echo "# LEDE OpenWrt 固件 - Rockchip ARMv8" > release_info.md
          fi
          echo "" >> release_info.md

          # 本仓库变更日志
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
              echo "<details>" >> release_info.md
              echo "<summary>本仓库变更 (${PREVIOUS_TAG}..${new_tag})</summary>" >> release_info.md
              echo "" >> release_info.md
              git log --pretty=format:"%h %s" ${PREVIOUS_TAG}..HEAD >> release_info.md
              echo "" >> release_info.md
              echo "</details>" >> release_info.md
          fi

          # LEDE 源码变更
          if [ -f release_assets/recent_git.log ]; then
            echo "<details>" >> release_info.md
            echo "<summary>LEDE 最近变更</summary>" >> release_info.md
            echo "" >> release_info.md
            echo "\`\`\`" >> release_info.md
            cat release_assets/recent_git.log >> release_info.md
            echo "\`\`\`" >> release_info.md
            echo "" >> release_info.md
            echo "</details>" >> release_info.md
          fi

          # 软件包清单
          if [ -f release_assets/openwrt-rockchip-armv8-nlnet_xiguapi-v3.manifest ]; then
            echo "<details>" >> release_info.md
            echo "<summary>内置软件包列表</summary>" >> release_info.md
            echo "" >> release_info.md
            echo "\`\`\`" >> release_info.md
            cat release_assets/openwrt-rockchip-armv8-nlnet_xiguapi-v3.manifest >> release_info.md
            echo "\`\`\`" >> release_info.md
            echo "" >> release_info.md
            echo "</details>" >> release_info.md
          fi

          # 文件哈希校验
          if [ -f release_assets/sha256sums ]; then
            echo "<details>" >> release_info.md
            echo "<summary>文件哈希校验</summary>" >> release_info.md
            echo "" >> release_info.md
            echo "\`\`\`" >> release_info.md
            cat release_assets/sha256sums >> release_info.md
            echo "\`\`\`" >> release_info.md
            echo "" >> release_info.md
            echo "</details>" >> release_info.md
          fi

      - name: Rename sysupgrade image
        run: |
          SRC_IMG="release_assets/openwrt-rockchip-armv8-nlnet_xiguapi-v3-squashfs-sysupgrade.img.gz"
          DST_IMG="release_assets/${{ steps.release-prepare.outputs.IMAGE_PREFIX }}squashfs-sysupgrade.img.gz"
          if [ -f "${SRC_IMG}" ]; then
            mv "${SRC_IMG}" "${DST_IMG}"
            echo "固件重命名完成"
          else
            echo "未找到 sysupgrade 固件，跳过重命名"
          fi

      - name: Create and push tag
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.release-prepare.outputs.new_tag }}
          git push origin ${{ steps.release-prepare.outputs.new_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-prepare.outputs.new_tag }}
          name: ${{ steps.release-prepare.outputs.RELEASE_TITLE }}
          body_path: release_info.md
          files: release_assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 自动清理7天前的旧工作流记录，保留最近5条
      - name: Clean old workflow runs
        uses: LeeHe-gif/delete-workflow-runs@main
        continue-on-error: true
        with:
          retain_days: 7
          keep_minimum_runs: 5
