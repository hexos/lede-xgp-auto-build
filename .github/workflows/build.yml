name: Build and Release (Rockchip ARMv8)

on:
  workflow_dispatch:
    inputs:
      log_switch:
        description: "开启详细编译日志 (V=s)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  TZ: Asia/Shanghai
  BUILD_LOG_ARG: ${{ inputs.log_switch == 'true' && 'V=s' || '' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check initial disk & memory
        run: |
          df -h
          free -h

      - name: Max free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          tool-cache: true
          swap-storage: false

      - name: Create extra 3G swap for anti‑OOM
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=3072 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Check space after deep clean + swap
        run: |
          df -h
          free -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pre‑clean apt
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/*
          df -h

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo ./install-env.sh

      - name: Fetch lede source by prepare.sh
        run: |
          ./prepare.sh

      - name: Feeds update & import config
        run: |
          set -e
          cd lede
          make distclean
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../xgp.config .config
          make defconfig
          make oldconfig <<< ""
          git diff .config || true

      - name: Cache dl source files
        uses: actions/cache@v4
        with:
          path: lede/dl
          key: lede-dl-${{ hashFiles('xgp.config') }}
          restore-keys: |
            lede-dl-

      - name: Download source packages
        run: |
          cd lede
          make -j1 download ${{ env.BUILD_LOG_ARG }}

      - name: Build firmware
        run: |
          cd lede
          make -j1 ${{ env.BUILD_LOG_ARG }}

      - name: Verify firmware output
        run: |
          OUTPUT_DIR="lede/bin/targets/rockchip/armv8"
          if [ ! -d "${OUTPUT_DIR}" ]; then
            echo "ERROR: 固件输出目录不存在，编译失败！"
            exit 1
          fi
          ls -la ${OUTPUT_DIR}/
          IMG_COUNT=$(ls ${OUTPUT_DIR}/*.img.gz 2>/dev/null | wc -l)
          echo "找到 ${IMG_COUNT} 个 img.gz 固件文件"
          if [ "${IMG_COUNT}" -eq 0 ]; then
            echo "ERROR: 未生成任何固件镜像！"
            exit 1
          fi

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          OUTPUT_DIR="lede/bin/targets/rockchip/armv8"
          cp ${OUTPUT_DIR}/*.img.gz release_assets/ || true
          cp ${OUTPUT_DIR}/*.manifest release_assets/ || true
          cp ${OUTPUT_DIR}/*.buildinfo release_assets/ || true
          cp ${OUTPUT_DIR}/profiles.json release_assets/ || true
          cp ${OUTPUT_DIR}/sha256sums release_assets/ || true
          cp ${OUTPUT_DIR}/version.buildinfo release_assets/ 2>/dev/null || true
          bash -c "cd lede && git log -n 30" > release_assets/recent_git.log

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: release_assets/

      - name: Calculate disk usage
        if: always()
        run: |
          df -h
          du -h --max-depth=2

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: release_assets/

      - name: List release files
        run: |
          ls -lah
          ls -lah release_assets

      - name: Prepare release info
        id: release-prepare
        run: |
          set -e
          current_date=$(date +'%y%m%d')
          current_time=$(date +'%H%M%S')
          new_tag=v0.${current_date}.${current_time}
          echo "current_date=${current_date}" >> $GITHUB_OUTPUT
          echo "current_time=${current_time}" >> $GITHUB_OUTPUT
          echo "new_tag=${new_tag}" >> $GITHUB_OUTPUT

          RELEASE_DATE=$(date '+%Y-%m-%d %H:%M:%S')
          VERSION="unknown"
          if [ -f release_assets/version.buildinfo ]; then
            VERSION=$(cat release_assets/version.buildinfo | grep '^r' | head -n 1 || echo "unknown")
          fi
          echo "RELEASE_TITLE=${RELEASE_DATE} - ${VERSION}" >> $GITHUB_OUTPUT
          image_prefix=LEDE-XGP-${current_date}${current_time}-
          echo "IMAGE_PREFIX=${image_prefix}" >> $GITHUB_OUTPUT

          echo "# LEDE OpenWrt 固件 - Rockchip ARMv8" > release_info.md
          echo "" >> release_info.md
          if [ -f release_header.md ];then cat release_header.md >> release_info.md;fi
          echo "" >> release_info.md

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
              echo "<details>" >> release_info.md
              echo "<summary>仓库变更 (${PREVIOUS_TAG}..${new_tag})</summary>" >> release_info.md
              echo "" >> release_info.md
              git log --pretty=format:"%h %s" ${PREVIOUS_TAG}..HEAD >> release_info.md
              echo "" >> release_info.md
              echo "</details>" >> release_info.md
          fi

          if [ -f release_assets/recent_git.log ]; then
            echo "<details>" >> release_info.md
            echo "<summary>LEDE 源码提交记录</summary>" >> release_info.md
            echo "" >> release_info.md
            echo "\`\`\`" >> release_info.md
            cat release_assets/recent_git.log >> release_info.md
            echo "\`\`\`" >> release_info.md
            echo "" >> release_info.md
            echo "</details>" >> release_info.md
          fi

          if [ -f release_assets/sha256sums ]; then
            echo "<details>" >> release_info.md
            echo "<summary>文件哈希校验</summary>" >> release_info.md
            echo "" >> release_info.md
            echo "\`\`\`" >> release_info.md
            cat release_assets/sha256sums >> release_info.md
            echo "\`\`\`" >> release_info.md
            echo "" >> release_info.md
            echo "</details>" >> release_info.md
          fi

      - name: Rename sysupgrade image
        run: |
          SRC_IMG=$(ls release_assets/*-squashfs-sysupgrade.img.gz 2>/dev/null || true)
          if [ -n "${SRC_IMG}" ]; then
            DST_IMG="release_assets/${{ steps.release-prepare.outputs.IMAGE_PREFIX }}squashfs-sysupgrade.img.gz"
            mv "${SRC_IMG}" "${DST_IMG}"
            echo "固件重命名完成: ${DST_IMG}"
          else
            echo "未找到sysupgrade固件，跳过重命名"
          fi

      - name: Create and push tag
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.release-prepare.outputs.new_tag }}
          git push origin ${{ steps.release-prepare.outputs.new_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-prepare.outputs.new_tag }}
          name: ${{ steps.release-prepare.outputs.RELEASE_TITLE }}
          body_path: release_info.md
          files: release_assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
